services:
  app:
    build: .
    container_name: voetbal-training-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/app.db
      - NODE_ENV=production
    volumes:
      - training-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  training-data:
